[package]
name = "axiolid-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately NOT a member of the kernel workspace: this harness must be able
# to point at an arbitrary kernel checkout to A/B two commits. Paths are
# relative so the repo is clonable; override with AXIOLID_KERNEL_DIR /
# IFCLITE_GEOMETRY_DIR via .cargo/config.toml if your layout differs.

[dependencies]
axiolid-core = { path = "../kernel/crates/foundation/core" }
axiolid-mesh = { path = "../kernel/crates/representations/discrete/mesh" }
axiolid-contracts = { path = "../kernel/crates/contracts/common/base" }
axiolid-mesh-boolean-contract = { path = "../kernel/crates/contracts/operations/mesh-boolean" }
axiolid-mesh-boolean-boolmesh = { path = "../kernel/crates/providers/mesh/boolmesh" }

# #77 exact boolean over planar-faced solids, to measure whether routing
# through it avoids boolmesh's failure mode on coincident planes.
axiolid-construct = { path = "../kernel/crates/algorithms/construction/construct" }
axiolid-levelset = { path = "../kernel/crates/algorithms/sampled/levelset" }
axiolid-inspect = { path = "../kernel/crates/algorithms/query/inspect" }

# Defect detection: self-intersections and duplicate vertices. Both
# capabilities existed in the kernel but were unreachable from the
# harness until this dependency was added.
axiolid-heal = { path = "../kernel/crates/algorithms/repair/heal" }
axiolid-measure = { path = "../kernel/crates/algorithms/query/measure" }
axiolid-reference = { path = "../kernel/crates/algorithms/reference" }
axiolid-mesh-section-contract = { path = "../kernel/crates/contracts/operations/mesh-section" }

# ifc-lite geometry kernel, driven directly through its public API.
ifc-lite-geometry = { path = "../../ifclite/rust/geometry" }

# Raw backend, to separate the boolean cost from axiolid provider overhead.
boolmesh = "0.1.9"

[build-dependencies]
cc = "1"

[profile.release]
debug = true
